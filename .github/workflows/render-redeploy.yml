
name: Render Redeploy Every 10 Minutes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}"
